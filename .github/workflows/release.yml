name: Release APK

# Se ejecuta al empujar una etiqueta v* (por ejemplo v1.0.0) y también a mano
# desde la pestaña Actions, en cuyo caso solo sube el APK como artefacto.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Compilar y publicar APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PillRemind
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Comprobar secretos de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::error::Falta el secreto KEYSTORE_BASE64. Revisa la sección «Publicación» del README."
            exit 1
          fi

      - name: Restaurar keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > release.p12

      - name: Calcular versión
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=dev-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi

      - name: Compilar APK de release
        env:
          KEYSTORE_FILE: release.p12
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease \
            -PversionName="$VERSION" \
            -PversionCode="${{ github.run_number }}"

      - name: Renombrar APK
        run: cp app/build/outputs/apk/release/app-release.apk "PillRemind-${VERSION}.apk"

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: PillRemind-${{ github.ref_name }}
          path: PillRemind/PillRemind-*.apk
          if-no-files-found: error

      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "PillRemind/PillRemind-${VERSION}.apk" \
            --title "PillRemind ${VERSION}" \
            --generate-notes
